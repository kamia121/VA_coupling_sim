name: Test and deploy site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Engine tests
        run: node tests/engine.test.mjs && node tests/shock.test.mjs && node tests/quoted_numbers.test.mjs && node tests/diastolic.test.mjs

  deploy:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      # Give every module and stylesheet URL the commit's version, so a browser that still holds
      # files from the previous deploy cannot combine them with new ones (a new page importing an
      # old engine.js or presets.js fails before it draws anything).
      - name: Version asset URLs
        run: |
          V=${GITHUB_SHA::8}
          find site \( -name '*.js' -o -name '*.html' \) -print0 | xargs -0 sed -i -E \
            -e "s#(['\"]\.{1,2}/(js/)?[A-Za-z0-9_-]+\.js)(['\"])#\1?v=$V\3#g" \
            -e "s#(href=\"css/[A-Za-z0-9_-]+\.css)\"#\1?v=$V\"#g"
          grep -rc "?v=$V" site --include='*.html' | head -3
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
